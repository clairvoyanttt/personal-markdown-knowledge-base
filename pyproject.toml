[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-markdown-knowledge-base"
version = "0.1.0.dev0"
description = "Windows local Markdown knowledge-base team development baseline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6-Essentials==6.12.0"]

[project.scripts]
pmkb = "pmkb.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pmkb.infrastructure.storage" = ["schema.sql"]
